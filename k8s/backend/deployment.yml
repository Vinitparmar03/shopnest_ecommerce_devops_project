apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    
    spec:
      containers:
        - name: shopnest-backend
          image: vinitparmar03/shopnest_backend:01
          ports:
            - containerPort: 5000
          livenessProbe:
            exec:
              command:
                - node
                - healthcheck.js
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5

